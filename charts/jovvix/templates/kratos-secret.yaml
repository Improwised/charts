{{- if and .Values.kratos.enabled .Values.kratos.secrets.enabled }}
{{- /*
  Named with the Kratos sub-chart's own helper, so the sub-chart reads exactly
  this Secret: "<release>-kratos" by default, or kratos.secret.nameOverride.
*/}}
{{- $user := .Values.database.username | urlquery | replace "+" "%20" }}
{{- $pass := include "jovvix.dbPassword" . | urlquery | replace "+" "%20" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kratos.secretname" .Subcharts.kratos }}
  labels:
    {{- include "jovvix.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=%s&search_path=kratos" $user $pass (include "jovvix.databaseHost" .) (.Values.database.port | int) .Values.database.name .Values.database.sslMode | quote }}
  secretsDefault: {{ include "jovvix.kratos.secretsDefault" . | quote }}
  secretsCookie: {{ include "jovvix.kratos.secretsCookie" . | quote }}
  secretsCipher: {{ include "jovvix.kratos.secretsCipher" . | quote }}
  smtpConnectionURI: {{ .Values.kratos.secrets.smtpConnectionURI | required "kratos.secrets.smtpConnectionURI is required (helm install --set 'kratos.secrets.smtpConnectionURI=smtp://user:pass@smtp.example.com:587/')" | quote }}
{{- end }}
