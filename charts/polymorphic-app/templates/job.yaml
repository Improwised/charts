{{- range .Values.jobs }}
{{- /* Any map, including {}, turns the hook on (with defaults); an absent item value falls back to jobTemplate.hook. */}}
{{- $hook := ternary .hook $.Values.jobTemplate.hook (and (hasKey . "hook") (kindIs "map" .hook)) }}
{{- $hookOn := kindIs "map" $hook }}
{{- $annotations := .annotations | default $.Values.jobTemplate.annotations | default dict }}
{{- if and $hookOn (hasKey $annotations "helm.sh/hook") }}
{{- fail (printf "jobs[%s]: set either hook or a helm.sh/hook annotation, not both" .name) }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
{{- if $.Values.prefixWithReleaseName.enabled }}
  name: "{{ $.Release.Name }}-{{ .name | default $.Values.jobTemplate.name }}"
{{- else}}
  name: "{{ .name | default $.Values.jobTemplate.name }}"
{{- end }}
  labels:
    {{- include "polymorphic-app.labels" $ | nindent 4 }}
    app.kubernetes.io/component: "{{ .name | default $.Values.jobTemplate.name }}"
  annotations:
    linkerd.io/inject: disabled
{{- if $hookOn }}
    helm.sh/hook: {{ join "," ($hook.events | default (list "pre-install" "pre-upgrade")) | quote }}
    helm.sh/hook-weight: {{ $hook.weight | default 0 | quote }}
    helm.sh/hook-delete-policy: {{ join "," ($hook.deletePolicy | default (list "before-hook-creation")) | quote }}
{{- end }}
{{- with .annotations | default $.Values.jobTemplate.annotations }}
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  {{- with include "polymorphic-app.extraSpec" (dict "template" $.Values.jobTemplate.extraJobSpec "item" .extraJobSpec "managed" (list "template") "what" "extraJobSpec") }}
  {{- . | nindent 2 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "polymorphic-app.podLabels" $ | nindent 8 }}
        app.kubernetes.io/component: "{{ .name | default $.Values.jobTemplate.name }}"
      {{- with .podAnnotations | default $.Values.jobTemplate.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .imagePullSecrets | indent 8 }}
      {{- else if $.Values.jobTemplate.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml $.Values.jobTemplate.imagePullSecrets | indent 8 }}
      {{- else }}
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml $.Values.imagePullSecrets | indent 8 }}
      {{- end }}
      {{- end }}
      restartPolicy: Never
      {{- with .initContainers | default $.Values.jobTemplate.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
{{- $jobName := .name | default $.Values.jobTemplate.name }}
{{ include "polymorphic-app.containerSpec" (dict
  "item" .
  "template" $.Values.jobTemplate
  "root" $
  "containerName" $jobName
) | indent 8 }}
      {{- with .securityContext | default $.Values.jobTemplate.securityContext }}
      securityContext:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .affinity | default $.Values.jobTemplate.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .tolerations | default $.Values.jobTemplate.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with include "polymorphic-app.extraSpec" (dict "template" $.Values.jobTemplate.extraPodSpec "item" .extraPodSpec "managed" (include "polymorphic-app.managedPodSpecKeys" . | fromJsonArray) "what" "extraPodSpec") }}
      {{- . | nindent 6 }}
      {{- end }}
      volumes:
      {{- if .volumes }}
{{ toYaml .volumes | indent 8 }}
      {{- end }}
      {{- if $.Values.volumes }}
{{ toYaml $.Values.volumes | indent 8 }}
      {{- end }}
      {{- if $.Values.jobTemplate.volumes }}
{{ toYaml $.Values.jobTemplate.volumes | indent 8 }}
      {{- end }}
{{- end }}
