{{- if .Values.access.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apexkube-agent.fullname" . }}-envoy-config
  namespace: {{ .Release.Namespace | quote }}
data:
  envoy.yaml: |
    static_resources:
          listeners:
            - name: listener_0
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: {{ .Values.envoy.containerPort }}
              filter_chains:
              {{- if .Values.envoy.tls.enabled }}
              - transport_socket:
                  name: envoy.transport_sockets.tls
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                    common_tls_context:
                      tls_certificates:
                        - certificate_chain:
                            filename: /etc/ssl/certs/tls.crt
                          private_key:
                            filename: /etc/ssl/certs/tls.key
                filters:
              {{- else }}
              - filters:
              {{- end }}
                  - name: envoy.filters.network.http_connection_manager
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                      stat_prefix: ingress_http
                      stream_idle_timeout: {{ .Values.envoy.config.streamIdleTimeout | quote }}
                      common_http_protocol_options:
                        idle_timeout: {{ .Values.envoy.config.commonHttpProtocolOptions.idleTimeout | quote }}
                      http_filters:
                      {{- if .Values.envoy.jwt.enabled }}
                        - name: envoy.filters.http.jwt_authn
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                            providers:
                              "jwt_provider":
                                issuer: {{ .Values.envoy.config.jwt.issuer | quote }}
                                audiences:
                                - {{ .Values.envoy.config.jwt.audience | quote }}
                                from_headers:
                                  - name: "Authorization"
                                    value_prefix: "Bearer "
                                local_jwks:
                                  inline_string: |
                                    {{ .Values.envoy.config.jwt.publicKey }}
                            rules:
                              - match: { path: "/healthz" }
                              - match: { path: "/readyz" }
                              - match:  { prefix: "/" }
                                requires:
                                  provider_name: "jwt_provider"
                      {{- end }}
                      {{- if .Values.envoy.injectServiceAccountToken }}
                        - name: envoy.filters.http.lua
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                            inline_code: |
                              -- Read the projected service account token on every request so a
                              -- rotated token is picked up immediately. No cache means no
                              -- dependency on os.time(), which the sandbox does not guarantee.
                              function envoy_on_request(request_handle)
                                local file = io.open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r")
                                if file then
                                  local token = file:read("*a")
                                  file:close()
                                  token = token:match("^%s*(.-)%s*$")
                                  if token and token ~= "" then
                                    request_handle:headers():replace("Authorization", "Bearer " .. token)
                                  end
                                end
                              end
                      {{- end }}
                        - name: envoy.filters.http.router
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      route_config:
                        name: local_route
                        virtual_hosts:
                          - name: backend_service
                            domains: ["*"]
                            routes:
                              - match: { prefix: "/" }
                                route:
                                  timeout: {{ .Values.envoy.config.routeTimeout | quote }}
                                  cluster: service_backend
                                  {{- if .Values.envoy.config.retry.enabled }}
                                  retry_policy:
                                    retry_on: {{ .Values.envoy.config.retry.retryOn | quote }}
                                    num_retries: {{ .Values.envoy.config.retry.numRetries }}
                                    per_try_timeout: {{ .Values.envoy.config.retry.perTryTimeout | quote }}
                                    retry_back_off:
                                      base_interval: {{ .Values.envoy.config.retry.backoff.baseInterval | quote }}
                                      max_interval: {{ .Values.envoy.config.retry.backoff.maxInterval | quote }}
                                  {{- end }}
                                  upgrade_configs:
                                    - upgrade_type: "websocket"
                                      enabled: true
                                    - upgrade_type: "SPDY/3.1"
                                      enabled: true

          clusters:
            - name: service_backend
              connect_timeout: 0.25s
              type: STRICT_DNS
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: service_backend
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: {{ .Values.envoy.backend.host }}
                              port_value: {{ .Values.envoy.backend.port }}
              {{- if .Values.envoy.backend.tls.enabled }}
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
                  sni: {{ .Values.envoy.backend.host }}
                  common_tls_context:
                    validation_context:
                      trusted_ca:
                        filename: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              {{- end }}
{{- end }}
