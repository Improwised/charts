{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apexkube-agent.metrics.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "apexkube-agent.metrics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # Remote-write, not scrape: writers post to /api/v1/receive and envoy
    # preserves the path.
    - name: remote-write
      {{- if .Values.access.enabled }}
      port: {{ .Values.metrics.envoy.combinedPort }}
      targetPort: metrics
      {{- else }}
      port: {{ .Values.metrics.envoy.containerPort }}
      targetPort: http
      {{- end }}
      protocol: TCP
  selector:
    {{- if .Values.access.enabled }}
    {{- include "apexkube-agent.selectorLabels" . | nindent 4 }}
    {{- else }}
    {{- include "apexkube-agent.metrics.selectorLabels" . | nindent 4 }}
    {{- end }}
{{- end }}
