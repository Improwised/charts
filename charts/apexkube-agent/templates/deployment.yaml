apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apexkube-agent.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "apexkube-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels:
      {{- include "apexkube-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apexkube-agent.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/envoy-config: {{ include (print $.Template.BasePath "/envoy-config-cm.yaml") . | sha256sum }}
        checksum/wireguard-config: {{ include (print $.Template.BasePath "/wireguard-config-cm.yaml") . | sha256sum }}
        checksum/tls-secret: {{ include (print $.Template.BasePath "/tls-sec.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "apexkube-agent.serviceAccountName" . }}
      containers:
        # Single container: WireGuard tunnel is brought up by the entrypoint,
        # which then execs Envoy as PID 1.
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.envoy.containerPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wg show wg0 latest-handshakes | awk -v now=$(date +%s) '$2 > 0 && now - $2 < 300 { f = 1 } END { exit !f }'
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 48
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: envoy-config-volume
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
            - name: tls-secret-volume
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: wireguard-config-volume
              mountPath: /etc/wireguard/wg0.conf
              subPath: wg0.conf
            - name: wireguard-privatekey-volume
              mountPath: /etc/wireguard/privatekey
              subPath: privatekey
      volumes:
        - name: envoy-config-volume
          configMap:
            name: {{ include "apexkube-agent.fullname" . }}-envoy-config
        - name: wireguard-config-volume
          configMap:
            name: {{ include "apexkube-agent.wireguard.configMapName" . }}
        - name: wireguard-privatekey-volume
          secret:
            secretName: {{ include "apexkube-agent.wireguard.secretName" . }}
        - name: tls-secret-volume
          secret:
            secretName: {{ default (printf "%s-tls" (include "apexkube-agent.fullname" . )) .Values.tls.existingSecret }}
