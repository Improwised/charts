{{- if and .Values.metrics.enabled (not .Values.metrics.wireguard.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apexkube-agent.metrics.fullname" . }}-wireguard-privatekey
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "apexkube-agent.metrics.labels" . | nindent 4 }}
type: Opaque
stringData:
  privatekey: {{ .Values.metrics.wireguard.config.privateKey | required "metrics.wireguard.config.privateKey is required when not using existingSecret" }}
{{- end -}}
