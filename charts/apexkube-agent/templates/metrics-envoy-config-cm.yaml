{{- if .Values.metrics.enabled }}
{{- $cfg := deepCopy .Values.envoy.config }}
{{- $_ := mergeOverwrite $cfg (.Values.metrics.envoy.config | default dict) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apexkube-agent.metrics.fullname" . }}-envoy-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "apexkube-agent.metrics.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.metrics.envoy.containerPort }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    stream_idle_timeout: {{ $cfg.streamIdleTimeout | quote }}
                    common_http_protocol_options:
                      idle_timeout: {{ $cfg.commonHttpProtocolOptions.idleTimeout | quote }}
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend_service
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route:
                                timeout: {{ $cfg.routeTimeout | quote }}
                                cluster: service_backend
                                {{- if $cfg.retry.enabled }}
                                retry_policy:
                                  retry_on: {{ $cfg.retry.retryOn | quote }}
                                  num_retries: {{ $cfg.retry.numRetries }}
                                  per_try_timeout: {{ $cfg.retry.perTryTimeout | quote }}
                                  retry_back_off:
                                    base_interval: {{ $cfg.retry.backoff.baseInterval | quote }}
                                    max_interval: {{ $cfg.retry.backoff.maxInterval | quote }}
                                {{- end }}
      clusters:
        - name: service_backend
          connect_timeout: 0.25s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: service_backend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ .Values.metrics.envoy.backend.host | quote }}
                          port_value: {{ .Values.metrics.envoy.backend.port }}
{{- end }}
