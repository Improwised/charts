apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apexkube-agent.clusterRoleBindingName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "apexkube-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  kind: ClusterRole
  name: {{ include "apexkube-agent.clusterRoleName" . }}
  apiGroup: rbac.authorization.k8s.io
