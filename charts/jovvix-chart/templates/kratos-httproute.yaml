{{- if and .Values.kratos.enabled .Values.kratos.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jovvix.fullname" . }}
  labels:
    {{- include "jovvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: kratos
spec:
  hostnames:
    {{- toYaml (.Values.kratos.httpRoute.hostnames | default (list .Values.global.domain)) | nindent 4 }}
  parentRefs:
    {{- toYaml .Values.kratos.httpRoute.parentRefs | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin/identities
      backendRefs:
        - name: {{ include "jovvix.kratosServicePrefix" . }}-admin
          port: 80
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /self-service
        - path:
            type: PathPrefix
            value: /sessions
      backendRefs:
        - name: {{ include "jovvix.kratosServicePrefix" . }}-public
          port: 80
          weight: 1
{{- end }}
