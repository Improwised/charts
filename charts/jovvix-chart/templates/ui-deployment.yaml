{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jovvix.ui.fullname" . }}
  labels:
    {{- include "jovvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.ui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "jovvix.ui.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jovvix.ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jovvix.serviceAccountName" . }}
      {{- with .Values.global.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "jovvix.ui.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 1
      containers:
        - name: jovvix-ui
          image: "{{ .Values.ui.image.repository }}:{{ default .Chart.AppVersion .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          {{- with .Values.global.security.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "jovvix.ui.fullname" . }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.port }}
              protocol: TCP
          {{- if .Values.ui.healthcheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.ui.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.ui.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.healthcheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.ui.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.ui.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.ui.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.ui.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.ui.healthcheck.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- end }}
