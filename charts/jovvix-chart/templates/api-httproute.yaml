{{- if and .Values.api.enabled .Values.api.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "jovvix.api.fullname" . }}
  labels:
    {{- include "jovvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  hostnames:
    {{- toYaml (.Values.api.httpRoute.hostnames | default (list .Values.global.domain)) | nindent 4 }}
  parentRefs:
    {{- toYaml .Values.api.httpRoute.parentRefs | nindent 4 }}
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ include "jovvix.api.fullname" . }}
          port: {{ .Values.api.service.port }}
          weight: 1
      matches:
        {{- toYaml .Values.api.httpRoute.matches | nindent 8 }}
{{- end }}
