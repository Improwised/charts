{{- if and .Values.api.enabled .Values.api.secret.enabled }}
{{- if not .Values.api.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jovvix.api.fullname" . }}
  labels:
    {{- include "jovvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DB_PASSWORD: {{ include "jovvix.dbPassword" . | quote }}
  JWT_SECRET: {{ include "jovvix.api.jwtSecret" . | quote }}
  REDIS_PASSWORD: {{ include "jovvix.redisPassword" . | quote }}
  SMTP_USERNAME: {{ .Values.api.secret.smtpUsername | required "api.secret.smtpUsername is required (helm install --set api.secret.smtpUsername=...)" | quote }}
  SMTP_PASSWORD: {{ .Values.api.secret.smtpPassword | required "api.secret.smtpPassword is required (helm install --set api.secret.smtpPassword=...)" | quote }}
{{- end }}
{{- end }}
