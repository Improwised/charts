{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jovvix.api.fullname" . }}
  labels:
    {{- include "jovvix.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "jovvix.api.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jovvix.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jovvix.serviceAccountName" . }}
      {{- with .Values.global.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "jovvix.api.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
              weight: 1
      {{- if .Values.api.initContainers.enabled }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.api.initContainers.waitForDb.image.repository }}:{{ .Values.api.initContainers.waitForDb.image.tag }}"
          imagePullPolicy: {{ .Values.api.initContainers.waitForDb.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until pg_isready -h {{ include "jovvix.databaseHost" . }} -p {{ .Values.database.port }} -U {{ .Values.database.username }};
              do echo "waiting for database"; sleep 2; done
          {{- with .Values.api.initContainers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: wait-for-redis
          image: "{{ .Values.api.initContainers.waitForRedis.image.repository }}:{{ .Values.api.initContainers.waitForRedis.image.tag }}"
          imagePullPolicy: {{ .Values.api.initContainers.waitForRedis.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until nc -z {{ include "jovvix.redisHost" . }} {{ .Values.redis.port }};
              do echo "waiting for redis"; sleep 2; done
          {{- with .Values.api.initContainers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: jovvix-api
          image: "{{ .Values.api.image.repository }}:{{ default .Chart.AppVersion .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.global.security.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - ./jovvix api
          envFrom:
            - configMapRef:
                name: {{ include "jovvix.api.fullname" . }}
            - secretRef:
                {{- if .Values.api.secret.existingSecret }}
                name: {{ .Values.api.secret.existingSecret }}
                {{- else }}
                name: {{ include "jovvix.api.fullname" . }}
                {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          {{- if .Values.api.healthcheck.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.api.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.api.healthcheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.healthcheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.api.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.api.healthcheck.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
{{- end }}
