name: Lint and Test Charts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Latest k8s versions. There's no series-based tag, nor is there a latest tag.
        k8s:
          - 1.33.12
          - 1.34.8
          - 1.35.5
          - 1.36.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.0

      - name: Adding bitnamirepo
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add bitnami-full-index https://raw.githubusercontent.com/bitnami/charts/archive-full-index/bitnami

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.5"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --excluded-charts freeipa

      # Charts with ci/compat/values/ must render those values exactly as the version on the default branch does,
      # unless the change is declared in ci/compat/allowed-changes.yaml. See .ci/scripts/render-compat.py.
      - name: Render compatibility against the released chart
        if: steps.list-changed.outputs.changed == 'true'
        # chart-testing activates its own virtualenv (no pip), so use the setup-python interpreter explicitly.
        run: |
          py="${pythonLocation}/bin/python"
          "$py" -m pip install --quiet pyyaml
          status=0
          for chart in $(ct list-changed --target-branch ${{ github.event.repository.default_branch }}); do
            "$py" .ci/scripts/render-compat.py "$chart" "origin/${{ github.event.repository.default_branch }}" || status=1
          done
          exit $status

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.0
        with:
          version: "v0.32.0"
          node_image: "kindest/node:v${{ matrix.k8s }}"

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --excluded-charts freeipa
